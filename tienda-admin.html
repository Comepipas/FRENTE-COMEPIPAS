<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material | Frente Comepipas</title><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"><link rel="stylesheet" href="assets/css/material-v32.2.css"><link rel="stylesheet" href="assets/css/admin-enterprise-v40.1.css"><link rel="stylesheet" href="assets/css/material-enterprise-v40.5.css"><script src="assets/js/roles.js"></script><script src="assets/js/auth-bootstrap-v13.3.js"></script><script>if(!protectAdminPage('tienda'))throw new Error('Acceso bloqueado');</script></head><body class="enterprise-body material-enterprise-body"><main class="material-main"><section class="m322-shell"><div class="m322-admin-head"><div><span class="kicker">GESTIÓN DE MATERIAL</span><h1>Material</h1><p>Gestiona el catálogo, la disponibilidad y las solicitudes.</p></div><div class="m322-actions"><a class="btn btn-dark-outline" href="tienda.html">Ver catálogo</a><button id="m20Export" class="btn btn-dark-outline">Exportar</button><button id="m20New" class="btn btn-primary">＋ Nuevo material</button></div></div><div id="m20Kpis" class="m322-kpis"></div><div class="m322-tabs"><button class="active" data-tab="catalog">Material</button><button data-tab="requests">Solicitudes</button></div><section id="m20CatalogPanel" class="m322-panel active"><div class="m322-toolbar"><input id="m20ItemSearch" type="search" placeholder="Buscar material"><select id="m20ItemAvailability"><option value="">Toda disponibilidad</option><option>Disponible</option><option>Pocas unidades</option><option>Consultar</option><option>Lista abierta</option><option>No disponible</option></select></div><div id="m20AdminGrid" class="m322-grid"></div></section><section id="m20RequestsPanel" class="m322-panel"><div class="m322-toolbar"><input id="m20RequestSearch" type="search" placeholder="Nombre, teléfono o referencia"><select id="m20RequestStatus"><option value="">Todos los estados</option><option>Pendiente</option><option>Contactado</option><option>Reservado</option><option>Entregado</option><option>Cancelado</option></select></div><div class="m322-table-wrap"><table class="m322-table"><thead><tr><th>Solicitud</th><th>Persona</th><th>Material</th><th>Contacto</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="m20RequestsBody"></tbody></table></div></section></section></main>
<dialog id="m20ItemDialog" class="m322-dialog"><form method="dialog" id="m20ItemForm"><h2>Material del catálogo</h2><input name="id" type="hidden"><input name="imagen_path" type="hidden"><input name="imagen_url" type="hidden"><div class="m322-form"><label>Nombre<input name="nombre" required></label><label>Categoría<select name="categoria_id"></select></label><label>Código interno<input name="codigo_interno"></label><label>Color<input name="color"></label><label>Precio (€)<input name="precio" type="number" min="0" step="0.01"></label><label><input name="mostrar_precio" type="checkbox" checked> Mostrar precio</label><label class="full">Descripción<textarea name="descripcion" rows="3"></textarea></label><label>Disponibilidad<select name="disponibilidad"><option>Disponible</option><option>Pocas unidades</option><option>Consultar</option><option>Lista abierta</option><option>No disponible</option></select></label><label>Unidades orientativas<input name="unidades_orientativas" type="number" min="0" value="0"></label><label>Variantes / tallas<input name="variantes"></label><label>Orden<input name="orden" type="number" value="100"></label><label class="full">Fotografías<input name="fotos" type="file" multiple accept="image/jpeg,image/png,image/webp"><small id="m321PhotoInfo">Puedes seleccionar varias imágenes.</small></label><div class="full"><strong>Galería actual</strong><div id="m322AdminGallery" class="m322-admin-gallery"></div></div><label class="full">Notas internas<textarea name="observaciones_internas"></textarea></label><label><input name="visible" type="checkbox" checked> Visible</label><label><input name="destacado" type="checkbox"> Destacado</label><label><input name="nuevo" type="checkbox"> Nuevo</label></div><div class="m322-actions"><button value="cancel" class="btn btn-dark-outline">Cancelar</button><button value="default" class="btn btn-primary">Guardar</button></div></form></dialog>
<dialog id="m20ManageDialog" class="m322-dialog"><form method="dialog" id="m20ManageForm"><h2>Gestionar solicitud</h2><input name="id" type="hidden"><div id="m20RequestDetail"></div><div class="m322-form"><label>Estado<select name="estado"><option>Pendiente</option><option>Contactado</option><option>Reservado</option><option>Entregado</option><option>Cancelado</option></select></label><label class="full">Respuesta / indicaciones<textarea name="nota_respuesta" rows="4"></textarea></label></div><div class="m322-actions"><button value="cancel" class="btn btn-dark-outline">Cancelar</button><button value="default" class="btn btn-primary">Guardar</button></div></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js?v=20"></script><script src="assets/js/image-optimizer-v32.1.js"></script><script src="assets/js/material-service-v32.2.js?v=40.5"></script><script src="assets/js/material-admin-v32.2.js?v=40.5"></script><script src="assets/js/material-enterprise-v40.5.js"></script></body></html>
